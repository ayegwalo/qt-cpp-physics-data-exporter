
name: Qt C++ Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build QtGUITest on macOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.9.2'
          host: mac
          target: desktop
          arch: clang_64

      - name: Check Qt installation
        run: |
          qmake -query QT_VERSION
          qmake -query QT_INSTALL_PREFIX
          cmake --version

      - name: Clean previous build
        run: rm -rf build

      - name: Configure CMake
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build Qt application
        run: cmake --build build --parallel 2 --verbose
